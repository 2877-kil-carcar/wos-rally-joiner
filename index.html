argets by 15–75% for all troops."}], "sources": ["https://wiki.wosforge.org/wiki/Renee", "https://wosheroes.com/heroes/renee/"]}, {"id": "wayne", "name": "ウェイン", "nameEn": "Wayne", "generation": 6, "generationLabel": "第6世代", "alwaysAvailable": false, "troopType": "marksman", "troopTypeJa": "弓兵", "rarity": "SSR", "skills": [{"number": 1, "isPrimary": true, "effect": "追加攻撃を行い、Lv1〜5で20/40/60/80/100%のダメージ", "target": "味方全部隊", "condition": "4ターンごと", "slots": [], "levelValues": [{"label": "Values", "scale": "20% / 40% / 60% / 80% / 100%"}], "sourceTextEn": "Wayne's brilliant battle planning allows all troops to launch an extra attack every 4 turns, dealing 20–100% damage."}, {"number": 2, "isPrimary": false, "effect": "敵槍兵へ8〜40%、敵弓兵へ4〜20%の追加ダメージ", "target": "味方弓兵", "condition": "2回に1回の攻撃", "slots": ["A"], "levelValues": [{"label": "Extra Damage to Lancers Up", "scale": "8% / 16% / 24% / 32% / 40%"}, {"label": "Extra Damage to Marksmen Up", "scale": "4% / 8% / 12% / 16% / 20%"}], "sourceTextEn": "Wayne's stratagems can pierce the thickest of defenses. On every other attack, his Marksmen deal 8–40% extra damage to enemy Lancers and 4–20% extra damage to enemy Marksmen."}, {"number": 3, "isPrimary": false, "effect": "会心率をLv1〜5で5/10/15/20/25%上昇", "target": "味方全部隊", "condition": "常時", "slots": [], "levelValues": [{"label": "Crit Rate", "scale": "5% / 10% / 15% / 20% / 25%"}], "sourceTextEn": "Wayne ensures no misstep goes unpunished with an eagle's eye for weakness, granting all troops' attacks a 5–25% Crit Rate."}], "sources": ["https://wiki.wosforge.org/wiki/Wayne", "https://wosheroes.com/heroes/wayne/"]}, {"id": "wu-ming", "name": "無名", "nameEn": "Wu Ming", "generation": 6, "generationLabel": "第6世代", "alwaysAvailable": false, "troopType": "infantry", "troopTypeJa": "盾兵", "rarity": "SSR", "skills": [{"number": 1, "isPrimary": true, "effect": "通常攻撃の被ダメージを5〜25%、スキルの被ダメージを6〜30%減少", "target": "味方盾兵", "condition": "常時", "slots": ["D"], "levelValues": [{"label": "Normal Attack Dam wosforge.org/wiki/Edith", "https://wosheroes.com/heroes/edith/"]}, {"id": "gordon", "name": "ゴードン", "nameEn": "Gordon", "generation": 7, "generationLabel": "第7世代", "alwaysAvailable": false, "troopType": "lancer", "troopTypeJa": "槍兵", "rarity": "SSR", "skills": [{"number": 1, "isPrimary": true, "effect": "2回攻撃ごとに20〜100%の追加ダメージと1ターンの毒を付与。毒状態の敵は与ダメージが4〜20%低下", "target": "味方槍兵／攻撃対象", "condition": "槍兵の2回攻撃ごと", "slots": ["A", "J"], "levelValues": [{"label": "Damage Up", "scale": "20% / 40% / 60% / 80% / 100%"}, {"label": "Enemy Damage Down", "scale": "4% / 8% / 12% / 16% / 20%"}], "sourceTextEn": "Gordon dips Lancers' weapons in venom. Every 2 attacks, Lancers deal 20–100% extra damage and apply poison to the target for 1 turn. Poisoned enemies deal 4–20% less damage."}, {"number": 2, "isPrimary": false, "effect": "槍兵の与ダメージを30〜150%上昇し、敵全部隊の与ダメージを6〜30%低下", "target": "味方槍兵／敵全部隊", "condition": "3ターンごとに1ターン", "slots": ["A", "J"], "levelValues": [{"label": "Damage Up", "scale": "30% / 60% / 90% / 120% / 150%"}, {"label": "Enemy Damage Down", "scale": "6% / 12% / 18% / 24% / 30%"}], "sourceTextEn": "Gordon's envenomed weapons terrorizes the field, increasing Lancers' Damage Dealt by 30–150% and reducing Damage Dealt by 6–30% for all enemy troops for 1 turn, every 3 turns."}, {"number": 3, "isPrimary": false, "effect": "敵盾兵の被ダメージを6〜30%上昇し、敵弓兵の与ダメージを6〜30%低下", "target": "敵盾兵・弓兵", "condition": "4ターンごとに2ターン", "slots": ["G", "J"], "levelValues": [{"label": "Enemy Infantry Damage Taken Up", "scale": "6% / 12% / 18% / 24% / 30%"}, {"label": "Enemy Marksman Damage Dealt Down", "scale": "6% / 12% / 18% / 24% / 30%"}], "sourceTextEn": "Gordon generates a defensive bio-toxic fog, confusing enemy frontline Infantry, increasing their Damage Taken by 6–30%, while blocking enemy Marksmen's line of sight to reduce their Damage Dealt by 6–30% for 2 turns every 4 turns."}], "sources": ["https://wiki.wosforge.org/wiki/Gordon", "https://wosheroes.com/heroes/gordon/"]}, {"id": "gatot", "name": "ガト", "nameEn": "Gatot", "generation": 8, "generationLabel": "第8世代", "alwaysAvailable": false, "troopType": "infantry", "troopTypeJa": "盾兵", "rarity": "SSR", "skills": [{"number": 1, "isPrimary": true, "effect": "防御力をLv1〜5で6/12/18/24/30%上昇", "target": "味方盾兵", "condition": "常時", "slots": [], "levelValues": [{"label": "Defense Up", "scale": "6% / 12% / 18% / 24% / 30%"}], "sourceTextEn": "Gatot commands his troops with imperial guard tactics, increasing his Infantry's Defense by 6–30%."}, {"number": 2, "isPrimary": false, "effect": "攻撃時、攻撃力のLv1〜5で6/12/18/24/30%相当のシールドを付与", "target": "味方盾兵", "condition": "攻撃ごとに1ターン", "slots": [], "levelValues": [{"label": "Shield Value Up", "scale": "6% / 12% / 18% / 24% / 30%"}], "sourceTextEn": "The great kings blesses Gatot's Infantry, granting Infantry a Shield with protection equal to Attack* 6–30% each time they attack, for 1 turn."}, {"number": 3, "isPrimary": false, "effect": "攻撃力をLv1〜5で5/10/15/20/25%低下", "target": "敵全部隊", "condition": "常時", "slots": ["H"], "levelValues": [{"label": "Reduces enemy Attack", "scale": "5% / 10% / 15% / 20% / 25%"}], "sourceTextEn": "Gatot's formidable legion instills fear in enemies, reducing their Attack by 5–25%."}], "sources": ["https://wiki.wosforge.org/wiki/Gatot", "https://wosheroes.com/heroes/gatot/"]}, {"id": "hendrik", "name": "ヘンドリック", "nameEn": "Hendrik", "generation": 8, "generationLabel": "第8世代", "alwaysAvailable": false, "troopType": "marksman", "troopTypeJa": "弓兵", "rarity": "SSR", "skills": [{"number": 1, "isPrimary": true, "effect": "防御力をLv1〜5で5/10/15/20/25%低下", "target": "敵全部隊", "condition": "常時", "slots": ["F"], "levelValues": [{"label": "Enemy Defense Down", "scale": "5% / 10% / 15% / 20% / 25%"}], "sourceTextEn": "Captain Hendrik commands a gigantic naval shipworm gnaw at the enemies' armor, reducing all enemy troops' Defense by 5–25%."}, {"number": 2, "isPrimary": false, "effect": "防御力をLv1〜5で6/12/18/24/30%上昇", "target": "味方全部隊", "condition": "4ターンごとに2ターン", "slots": [], "levelValues": [{"label": "Defense Up", "scale": "6% / 12% / 18% / 24% / 30%"}], "sourceTextEn": "Hendrik covers all Troops with a layer of hard-shelled barnacles every 4 turns, increasing their Defense by 6–30% for 2 turns."}, {"number": 3, "isPrimary": false, "effect": "敵全体へLv1〜5で8/16/24/32/40%のダメージ", "target": "味方弓兵／敵全部隊", "condition": "3ターンごと", "slots": [], "levelValues": [{"label": "Values", "scale": "8% / 16% / 24% / 32% / 40%"}], "sourceTextEn": "Every 3 turns, the ancient abyssal spirit's descendents will work together with Hendrik's Marksmen to launch an attack, dealing 8–40% damage to all enemies."}], "sources": ["https://wiki.wosforge.org/wiki/Hendrik", "https://wosheroes.com/heroes/hendrik/"]}, {"id": "sonya", "name": "ソニヤ", "nameEn": "Sonya", "generation": 8, "generationLabel": "第8世代", "alwaysAvailable": false, "troopType": "lancer", "troopTypeJa": "槍兵", "rarity": "SSR", "skills": [{"number": 1, "isPrimary": true, "effect": "与ダメージをLv1〜5で4/8/12/16/20%上昇", "target": "味方全部隊", "condition": "常時", "slots": ["A"], "levelValues": [{"label": "Values", "scale": "4% / 8% / 12% / 16% / 20%"}], "sourceTextEn": "“Everyone has a share when the legendary ocean treasure is found!” Sonya's promise inspires everyone, increasing Damage by 4–20% for all troops."}, {"number": 2, "isPrimary": false, "effect": "2回攻撃ごとに槍兵の与ダメージを15〜75%上昇し、味方全部隊の攻撃力を5〜25%上昇", "target": "味方槍兵・全部隊", "condition": "2回攻撃ごと。攻撃力上昇は1ターン", "slots": ["A", "B"], "levelValues": [{"label": "Damage Up", "scale": "15% / 30% / 45% / 60% / 75%"}, {"label": "Attack Up", "scale": "5% / 10% / 15% / 20% / 25%"}], "sourceTextEn": "Sonya motivates her Troops with bounty, making her Lancers deal 15–75% more damage every 2 attacks and increasing Attack by 5–25% for all troops for 1 turn."}, {"number": 3, "isPrimary": false, "effect": "Lv1〜5で50/100/150/200/250%のダメージを与え、対象を1ターン眩暈", "target": "味方槍兵／攻撃対象", "condition": "5ターンごと", "slots": [], "levelValues": [{"label": "Values", "scale": "50% / 100% / 150% / 200% / 250%"}], "sourceTextEn": "Sonya's Lancers will seize every chance to launch a surprise raid like underwater currents. Her Lancers deal 50–250% damage every 5 turns and stun the target for 1 turn."}], "sources": ["https://wiki.wosforge.org/wiki/Sonya", "https://wosheroes.com/heroes/sonya/"]}]}</script>
<script>
(()=>{const db=JSON.parse(document.getElementById('app-data').textContent);const $=s=>document.querySelector(s);const gen=$('#generation'),list=$('#hero-list'),slotBoard=$('#slot-board');let mode='all';for(let i=1;i<=8;i++)gen.add(new Option(`第${i}世代まで`,i));gen.value='8';const typeIcon={infantry:'🛡️',lancer:'🐎',marksman:'🏹'};
function available(){const g=+gen.value;return db.heroes.filter(h=>h.alwaysAvailable||h.generation<=g)}
function fillLeaders(reset=false){const hs=available();document.querySelectorAll('.leader-card select').forEach(sel=>{const type=sel.dataset.type,old=sel.value;sel.innerHTML='';sel.add(new Option('未選択',''));hs.filter(h=>h.troopType===type).sort((a,b)=>b.generation-a.generation||a.name.localeCompare(b.name,'ja')).forEach(h=>sel.add(new Option(`${h.name}｜${h.rarity} ${h.generationLabel}`,h.id)));if(!reset&&[...sel.options].some(o=>o.value===old))sel.value=old;else{const newest=hs.filter(h=>h.troopType===type&&h.rarity==='SSR').sort((a,b)=>b.generation-a.generation)[0];sel.value=newest?.id||''}})}
function leaders(){return [...document.querySelectorAll('.leader-card select')].map(s=>db.heroes.find(h=>h.id===s.value)).filter(Boolean)}
function activeSlots(){return new Set(leaders().flatMap(h=>h.skills.flatMap(s=>s.slots)))}
function renderSlots(active){slotBoard.innerHTML=Object.entries(db.slotDefinitions).map(([key,label])=>`<span class="slot ${active.has(key)?'active':''}"><b>${key}</b>${label}</span>`).join('')}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const hs=available(),active=activeSlots(),lead=leaders();renderSlots(active);$('#leader-names').textContent=lead.map(h=>h.name).join('・')||'未選択';let shownSkills=0;list.innerHTML=hs.map(h=>{const skills=h.skills.filter(s=>mode==='all'||s.isPrimary);shownSkills+=skills.length;const rows=skills.map(s=>{const hits=s.slots.filter(x=>active.has(x));return `<article class="skill ${s.isPrimary?'primary':''}"><div class="num">${s.isPrimary?'⭐ ':''}${s.number}</div><div><div class="effect">${esc(s.effect)}</div><div class="meta"><span class="tag">対象: ${esc(s.target)}</span><span class="tag">条件: ${esc(s.condition)}</span></div>${mode==='joiner'&&hits.length?`<div class="overlap">集結主と同枠: ${hits.join(' / ')}</div>`:''}<div class="source"><details><summary>照合用の英語原文</summary><p>${esc(s.sourceTextEn)}</p></details></div></div><div class="skill-slots">${s.slots.length?s.slots.map(x=>`<span class="slot-chip ${active.has(x)?'hit':''}" title="${esc(db.slotDefinitions[x])}">${x} · ${esc(db.slotDefinitions[x])}</span>`).join(''):'<span class="outside">11枠外</span>'}</div></article>`}).join('');return `<details class="hero" open><summary><span>${typeIcon[h.troopType]}</span><span class="hero-name">${esc(h.name)}</span><span class="badges"><span class="badge ${h.rarity.toLowerCase()}">${h.rarity}</span><span class="badge gen-label">${esc(h.generationLabel)}</span></span></summary><div class="skills">${rows}</div></details>`}).join('')||'<div class="empty">表示できる英雄がありません。</div>';$('#hero-count').textContent=hs.length;$('#skill-count').textContent=shownSkills;$('#active-count').textContent=active.size;$('#list-title').textContent=mode==='all'?'英雄・遠征スキル':'乗り手候補・第1遠征スキル';$('#mode-note').textContent=mode==='all'?'全スキルを表示中。集結主のスキルと同じ計算枠は金色で表示されます。':'乗り手で参照される⭐第1遠征スキルのみ表示中。集結主と同じ枠は金色＋「同枠」で示します。'}
gen.addEventListener('change',()=>{fillLeaders(true);render()});document.querySelectorAll('.leader-card select').forEach(s=>s.addEventListener('change',render));document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()}));fillLeaders(true);render();})();
</script>
</body></html>
